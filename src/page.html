<title>Dami 加密日報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky masthead · left rail = report index · right = desk (stance band → KPI tiles → level ladder + trends → checks/stocks → full report) */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f5f7fa; --fg:#121a24; --muted:#5b6878; --faint:#8a96a5; --line:#dbe1e8;
  --accent:#2457c5; --accent-soft:#e3ebfb;
  --up:#d1343e; --down:#14935a; --up-soft:#fbe6e7; --down-soft:#dff3ea;
  --warn:#b7700b; --warn-soft:#fbefdb;
  --am:#b8650a; --am-bg:#fdf1e2; --pm:#4b3fb3; --pm-bg:#ecebfb;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --surface:#141b25; --sunk:#10161f; --fg:#e6ebf2; --muted:#9aa7b7; --faint:#6c7888; --line:#253042;
  --accent:#7aa7f5; --accent-soft:#1d2a44;
  --up:#ff6b72; --down:#3fd18b; --up-soft:#3a1d22; --down-soft:#15332a;
  --warn:#f2b24f; --warn-soft:#3a2c14;
  --am:#f0a64a; --am-bg:#33261a; --pm:#a59bf5; --pm-bg:#252246; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#141b25; --sunk:#10161f; --fg:#e6ebf2; --muted:#9aa7b7; --faint:#6c7888; --line:#253042;
  --accent:#7aa7f5; --accent-soft:#1d2a44;
  --up:#ff6b72; --down:#3fd18b; --up-soft:#3a1d22; --down-soft:#15332a;
  --warn:#f2b24f; --warn-soft:#3a2c14;
  --am:#f0a64a; --am-bg:#33261a; --pm:#a59bf5; --pm-bg:#252246; color-scheme:dark }
/* International convention: green up, red down */
body{--up-x:var(--down);--down-x:var(--up);--up-xs:var(--down-soft);--down-xs:var(--up-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.mast .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--fg);display:grid;place-items:center}
.logo svg{display:block}
.brand h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.03em}
.brand .sub{color:var(--muted);font-size:12px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:3px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12);font-weight:500}

main .wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-block:20px 48px}
@media (max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}
nav.idx{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:860px){nav.idx{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}}
.idx-title{font-size:11px;letter-spacing:.12em;color:var(--faint);margin:0 0 8px 10px}
@media (max-width:860px){.idx-title{display:none}}
.day{margin-bottom:12px}
@media (max-width:860px){.day{margin:0;flex:0 0 auto;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px}}
.day-label{font-family:var(--f-num);font-size:12px;color:var(--muted);margin:0 0 2px 10px}
@media (max-width:860px){.day-label{margin:0 4px}}
.idx a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:13px}
.idx a:hover{background:var(--surface)}
.idx a[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.chip.morning,.dot.morning{color:var(--am);background:var(--am-bg)}
.chip.evening,.dot.evening{color:var(--pm);background:var(--pm-bg)}
.dot.morning{background:var(--am)} .dot.evening{background:var(--pm)}

.desk{min-width:0;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h2 small{font-weight:400;letter-spacing:0;color:var(--faint);font-size:12px}

/* Stance band */
.stance{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px 20px}
@media (max-width:620px){.stance{grid-template-columns:minmax(0,1fr)}}
.verdict{display:grid;place-items:center;min-width:132px;padding:12px 16px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.verdict .lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.verdict .v{font-size:30px;font-weight:900;line-height:1.2}
.verdict.long .v{color:var(--up-x)} .verdict.short .v{color:var(--down-x)} .verdict.wait .v{color:var(--warn)} .verdict.reduce .v{color:var(--down-x)}
.stance .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:6px}
.stance .lede{margin:0;font-size:16px;font-weight:500;line-height:1.6;text-wrap:pretty}
.qqq{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.qqq.on{color:var(--up-x)} .qqq.off{color:var(--down-x)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600}
.kpi .s{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi svg{display:block;width:100%;height:auto;margin-top:4px}
.chg.up{color:var(--up-x)} .chg.down{color:var(--down-x)} .chg.flat{color:var(--muted)}
.na{color:var(--faint);font-size:16px;font-weight:400}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.sc-table{width:100%;min-width:620px;border-collapse:collapse;font-size:13px;margin-top:10px}
.sc-table td:nth-child(2){min-width:170px}
.sc-table th,.sc-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sc-table th{color:var(--muted);font-weight:500;white-space:nowrap}
.sc-table td.num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.side{font-weight:700;white-space:nowrap}
.side.long{color:var(--up-x)} .side.short{color:var(--down-x)}

.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.trend h3{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
.empty-note{color:var(--faint);font-size:13px;padding:18px 0;text-align:center}

.hb{display:grid;gap:10px}
.hb-row{display:grid;grid-template-columns:52px minmax(0,1fr) 68px;align-items:center;column-gap:10px;row-gap:2px}
.hb-sym{font-weight:600;font-size:13px}
.hb-track{position:relative;height:14px;background:var(--sunk);border-radius:3px}
.hb-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.hb-bar{position:absolute;top:0;bottom:0;border-radius:3px}
.hb-bar.up{background:var(--up-x)} .hb-bar.down{background:var(--down-x)}
.hb-val{text-align:right;font-size:13px;font-weight:600}
.hb-note{grid-column:2 / 4;font-size:11px;color:var(--faint);line-height:1.4;min-width:0;overflow-wrap:anywhere}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.st{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;min-width:52px;text-align:center}
.st.ok{background:var(--down-soft);color:var(--down)} .st.no{background:var(--up-soft);color:var(--up)} .st.wait{background:var(--warn-soft);color:var(--warn)}
.macro{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.macro div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.macro .k{font-size:11px;color:var(--muted);display:block}
.macro .v{font-size:17px;font-weight:600}

/* Report body */
details.report>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.report>summary::-webkit-details-marker{display:none}
details.report>summary h2{margin:0}
details.report>summary .tog{font-size:12px;color:var(--accent)}
.md{max-width:76ch;margin-top:8px}
.md h1{font-size:22px;line-height:1.35;margin:0 0 8px;text-wrap:balance}
.md h2{font-size:17px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--fg);letter-spacing:0;display:block}
.md h3{font-size:15px;margin:18px 0 6px}
.md p,.md li{margin:5px 0}
.md ul,.md ol{padding-left:1.3em}
.md a{color:var(--accent);word-break:break-word}
.md blockquote{margin:12px 0;padding:8px 14px;background:var(--sunk);border-left:3px solid var(--line);border-radius:0 6px 6px 0;color:var(--muted)}
.md blockquote p{margin:0}
.md code{font-family:var(--f-num);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md .tbl{overflow-x:auto;margin:10px 0}
.md table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{color:var(--muted);white-space:nowrap;font-weight:500}
.note{font-size:12px;color:var(--faint);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:56px 16px}
.empty h2{color:var(--fg);font-size:18px;margin:0 0 8px;letter-spacing:0;display:block}
/* reading + kline + causal */
.panel h2{flex-wrap:wrap}
.gbtn{border:1px solid var(--line);background:var(--sunk);color:var(--accent);font-size:12px;font-weight:500;letter-spacing:0;padding:2px 10px;border-radius:999px}
.gbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.guide{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:-4px 0 12px;font-size:13px;line-height:1.7}
.guide ul{margin:0;padding-left:1.1em}.guide li{margin:3px 0}
.reading{margin:12px 0 0;font-size:14px;line-height:1.7;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.rtag{display:inline-block;font-size:11px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.panel.slim{padding:10px 16px}.panel.slim h2{margin:0}.panel.slim .reading{margin-top:8px}
.sigs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sig{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.sig.up{color:var(--up-x);border-color:currentColor}.sig.dn{color:var(--down-x);border-color:currentColor}.sig.warn{color:var(--warn);border-color:currentColor}
.kwrap{overflow:hidden}
.kline .khit{cursor:crosshair}
.kline .ph{transition:opacity .2s}.kline.focus .ph:not(.on){opacity:.25}.kline.focus .ph.on rect{opacity:.18}
.story{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.story h3{margin:0 0 6px;font-size:15px}
.story-sum{margin:0 0 10px;font-size:14px;line-height:1.75}
.phases{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.phases li{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer;transition:border-color .15s,transform .15s}
.phases li:hover,.phases li.on{border-color:var(--accent);transform:translateY(-1px)}
.pn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface)}
.pn.a{background:var(--accent)}.pn.b{background:var(--pm)}
.pt-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.pt-h span{font-size:11px;color:var(--faint)}
.phases p{margin:4px 0 0;font-size:13px;line-height:1.65;color:var(--muted)}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:26px}
@media (max-width:900px){.flow{grid-auto-flow:row;gap:22px}}
.node{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.node .step{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.node p{margin:0;font-size:13px;line-height:1.65}
.node:not(:last-child)::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:16px}
@media (max-width:900px){.node:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-21px;transform:translateX(-50%)}}
.assets{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.assets span{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.assets .up{color:var(--up-x)}.assets .dn{color:var(--down-x)}
@media (prefers-reduced-motion:no-preference){.desk.anim .node{animation:rise .5s calc(.3s + var(--k) * .12s) both}.desk.anim .kline .cdl{animation:fade .5s .2s both}}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.evlist{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.evlist b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--fg);color:var(--surface);font-size:10px;margin-right:2px}
.toast:not(.on){visibility:hidden;transition:transform .35s,visibility 0s .35s}
.ychips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.ychip{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:1px}
.ychip .k{font-size:11px;color:var(--muted)}.ychip .v{font-size:19px;font-weight:600}.ychip .d{font-size:11px;color:var(--faint)}
.ygrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.ygrid{grid-template-columns:minmax(0,1fr)}}
.liveband{padding:12px 16px}
.lb-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-bottom:10px}
.lb-t{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.lb-s{font-size:12px;color:var(--muted)}.lb-s .stale{color:var(--warn)}
.pulse.off{background:var(--warn);animation:none}
.lb-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lb-i{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:1px;min-width:0;position:relative}
.lb-i .k{font-size:11px;color:var(--muted)}.lb-i .v{font-size:18px;font-weight:600}.lb-i .v small{font-size:11px;color:var(--muted);font-weight:400}
.lb-i .v .chg{font-size:13px}.lb-i .s{font-size:11px;color:var(--faint)}
.spark{width:100%;max-width:140px;height:auto;margin-top:2px}
.kseg{margin-left:auto}
/* motion */
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--surface);font:500 12px/1.4 var(--f-num);padding:4px 8px;border-radius:6px;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.chart .hit{cursor:crosshair}
.chart .pt{transition:r .15s}
.ladder .scn{transition:opacity .2s}
.ladder.focus .scn:not(.on){opacity:.18}
.sc-table tr[data-i]{cursor:pointer;transition:background .15s}
.sc-table tr[data-i]:hover,.sc-table tr.on{background:var(--sunk)}
.kpi{transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0 / .08);border-color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.live b{font-weight:600;color:var(--fg)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 var(--down)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:30;background:var(--fg);color:var(--surface);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgb(0 0 0 / .25);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;border-radius:6px;padding:4px 10px;background:var(--accent);color:#fff;font-weight:600}
.verdict{position:relative;overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  .desk.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .desk.anim .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s .25s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .desk.anim .fadein{animation:fade .8s .8s both}@keyframes fade{from{opacity:0}}
  .desk.anim .needle{animation:needle 1.2s .3s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes needle{from{transform:rotate(var(--a))}to{transform:rotate(0)}}
  .desk.anim .gy-b,.desk.anim .gy-t,.desk.anim .gx-l,.desk.anim .gx-r{transform-box:fill-box;animation:grow .7s .3s cubic-bezier(.2,.8,.2,1) both}
  .gy-b{transform-origin:bottom}.gy-t{transform-origin:top}.gx-l{transform-origin:left}.gx-r{transform-origin:right}
  .desk.anim .gy-b,.desk.anim .gy-t{animation-name:growy}
  @keyframes growy{from{transform:scaleY(0)}}@keyframes grow{from{transform:scaleX(0)}}
  .desk.anim .hb-bar{animation:grow .7s .35s cubic-bezier(.2,.8,.2,1) both}
  .hb-bar.up{transform-origin:left}.hb-bar.down{transform-origin:right}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const KIND={morning:"早報",evening:"晚報＋美股"};
const state={reports:[],filter:"all",current:null,loaded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=v=>typeof v==="number"&&isFinite(v);
const fmt=(v,d=0)=>isNum(v)?v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const sgn=(v,d=1)=>isNum(v)?(v>0?"+":"")+fmt(v,d):"—";
const dir=v=>!isNum(v)||v===0?"flat":v>0?"up":"down";
const svgNS="http://www.w3.org/2000/svg";
function weekday(d){const t=new Date(d+"T12:00:00+08:00");return isNaN(t)?"":"週"+"日一二三四五六"[t.getDay()]}
function when(iso){try{return new Date(iso).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){return iso||""}}
const css=n=>getComputedStyle(document.body).getPropertyValue(n).trim();

function visible(){return state.reports.filter(r=>state.filter==="all"||r.kind===state.filter)}

function renderIndex(){
  const byDay=new Map();
  visible().forEach(r=>{if(!byDay.has(r.date))byDay.set(r.date,[]);byDay.get(r.date).push(r)});
  const nav=$("#idx"); nav.innerHTML='<p class="idx-title">報告</p>';
  for(const [d,items] of byDay){
    const box=document.createElement("div"); box.className="day";
    box.innerHTML='<div class="day-label">'+esc(d.slice(5).replace("-","/"))+" "+weekday(d)+'</div>';
    items.sort((a,b)=>a.kind==="evening"?-1:1).forEach(r=>{
      const a=document.createElement("a"); a.href="#r-"+r.id;
      if(r.id===state.current)a.setAttribute("aria-current","true");
      a.innerHTML='<span class="dot '+esc(r.kind)+'"></span>'+esc(KIND[r.kind]||r.kind)+(r.metrics?.stance?' <span style="margin-left:auto;color:var(--faint);font-size:12px">'+esc(r.metrics.stance)+'</span>':"");
      box.appendChild(a);
    });
    nav.appendChild(box);
  }
}

/* ---------- charts ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(svgNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

function gauge(v){
  const w=150,h=86,cx=75,cy=78,r=62;
  const s=el("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":"恐懼貪婪指數 "+v});
  const seg=[[0,25,"--down-x"],[25,45,"--warn"],[45,55,"--faint"],[55,75,"--warn"],[75,100,"--up-x"]];
  const pt=(p,rr)=>{const a=Math.PI*(1-p/100);return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
  seg.forEach(([a,b,c])=>{const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r);el("path",{d:`M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`,fill:"none",stroke:css(c),"stroke-width":9,opacity:.35},s)});
  if(isNum(v)){const [x,y]=pt(v,r);const [x0,y0]=pt(0,r);el("path",{d:`M${x0} ${y0} A${r} ${r} 0 0 1 ${x} ${y}`,fill:"none",stroke:css("--fg"),"stroke-width":9,"stroke-linecap":"round",class:"draw"},s);
    const [nx,ny]=pt(v,r-18);const nd=el("line",{x1:cx,y1:cy,x2:nx,y2:ny,stroke:css("--fg"),"stroke-width":2,class:"needle"},s);nd.style.setProperty("--a",(-v*1.8)+"deg");nd.style.transformOrigin=cx+"px "+cy+"px";el("circle",{cx,cy,r:3.5,fill:css("--fg")},s)}
  return s;
}

function flowBar(btc,eth){
  const w=170,h=40,mid=85,max=Math.max(700,Math.abs(btc||0),Math.abs(eth||0));
  const s=el("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":"ETF 淨流量"});
  el("line",{x1:mid,y1:0,x2:mid,y2:h,stroke:css("--line")},s);
  [[btc,"BTC",6],[eth,"ETH",24]].forEach(([v,l,y])=>{
    if(!isNum(v))return;const len=Math.abs(v)/max*(mid-26);
    el("rect",{x:v>=0?mid:mid-len,y,width:Math.max(len,1),height:10,rx:2,fill:css(v>=0?"--up-x":"--down-x"),class:v>=0?"gx-l":"gx-r"},s);
    const t=el("text",{x:v>=0?mid-4:mid+4,y:y+9,"text-anchor":v>=0?"end":"start","font-size":10,fill:css("--muted"),"font-family":"IBM Plex Mono, monospace"},s);t.textContent=l;
  });
  return s;
}

function ladder(m,price){
  const sc=(m.scenarios||[]).filter(x=>isNum(x.entry));
  const lv=m.levels||{};
  const vals=[price,...(lv.support||[]),...(lv.resistance||[]),...sc.flatMap(x=>[x.entry,x.stop,x.t1,x.t2])].filter(isNum);
  if(vals.length<2)return null;
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.06||500;lo-=pad;hi+=pad;
  const narrow=(document.getElementById('desk')?.clientWidth||900)<560;
  const W=narrow?380:560,H=narrow?360:320,L=8,R=58,T=10,B=26,LBL=narrow?70:150,RL=narrow?78:96;
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,class:"chart ladder",role:"img","aria-label":"BTC 關鍵價位與情境"}),svg=s;
  const step=niceStep((hi-lo)/6);
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){el("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"grid"},s);const t=el("text",{x:W-R+6,y:y(v)+4},s);t.textContent=fmt(v)}
  (lv.resistance||[]).forEach(v=>{el("rect",{x:L,width:W-R-L,y:y(v)-3,height:6,fill:css("--down-x"),opacity:.14},s);lab(s,L+4,y(v)-6,"壓力 "+fmt(v),"--down-x")});
  (lv.support||[]).forEach(v=>{el("rect",{x:L,width:W-R-L,y:y(v)-3,height:6,fill:css("--up-x"),opacity:.14},s);lab(s,L+4,y(v)+14,"支撐 "+fmt(v),"--up-x")});
  const cols=sc.length,colW=(W-R-L-LBL-RL)/Math.max(cols,1)+RL/Math.max(cols,1)*0;
  sc.forEach((x,i)=>{
    const cx=L+LBL+colW*(i+.35)+(RL/cols)*i,bw=Math.min(30,colW*.45);
    const good=x.side==="short"?"--down-x":"--up-x";const s=el("g",{class:"scn","data-i":i},svg);
    el("rect",{x:cx-bw/2,width:bw,y:Math.min(y(x.entry),y(x.stop)),height:Math.abs(y(x.entry)-y(x.stop)),fill:css("--faint"),opacity:.35,rx:3},s);
    el("rect",{x:cx-bw/2,width:bw,y:Math.min(y(x.entry),y(x.t2??x.t1)),height:Math.abs(y(x.entry)-y(x.t2??x.t1)),fill:css(good),opacity:.22,rx:3},s);
    [[x.t1,"T1"],[x.t2,"T2"]].forEach(([v,n])=>{if(!isNum(v))return;el("line",{x1:cx-bw/2-4,x2:cx+bw/2+4,y1:y(v),y2:y(v),stroke:css(good),"stroke-width":2},s);tx(s,cx+bw/2+8,y(v)+4,n+" "+fmt(v),good)});
    el("line",{x1:cx-bw/2-4,x2:cx+bw/2+4,y1:y(x.stop),y2:y(x.stop),stroke:css("--fg"),"stroke-width":2,"stroke-dasharray":"3 2"},s);tx(s,cx+bw/2+8,y(x.stop)+4,"停損 "+fmt(x.stop),"--muted");
    el("circle",{cx,cy:y(x.entry),r:5,fill:css("--surface"),stroke:css(good),"stroke-width":2.5},s);tx(s,cx+bw/2+8,y(x.entry)+4,"進場 "+fmt(x.entry),"--fg");
    const h=el("text",{x:cx,y:H-8,"text-anchor":"middle","font-size":12,"font-weight":700},s);h.style.fill=css(good);h.textContent=x.name;
  });
  if(isNum(price)){el("line",{x1:L,x2:W-R,y1:y(price),y2:y(price),stroke:css("--accent"),"stroke-width":1.5,class:"pline"},s);
    el("rect",{x:W-R+2,y:y(price)-9,width:R-2,height:18,rx:4,fill:css("--accent")},s);const t=el("text",{x:W-R+6,y:y(price)+4},s);t.style.fill=css("--surface");t.style.fontWeight=600;t.textContent=fmt(price);
}
  if(Array.isArray(m.prices?.[0]?.range24h)){const [a,b]=m.prices[0].range24h;el("rect",{x:L+LBL-24,width:6,y:y(b),height:y(a)-y(b),fill:css("--accent"),opacity:.45,rx:2},s);tx(s,L+LBL-48,y(b)-4,"24h","--accent")}
  return s;
}
function lab(s,x,y,t,c){const e=el("text",{x,y,"font-size":11},s);e.style.fill=css(c);e.textContent=t}
function tx(s,x,y,t,c){const e=el("text",{x,y,"font-size":11},s);e.style.fill=css(c);e.textContent=t}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of[1,2,2.5,5,10])if(raw<=m*p)return m*p;return 10*p}

function lineChart(points,{label,dec=0,color="--accent",zero=false,band}={}){
  if(points.length<2)return null;
  const W=320,H=150,L=8,R=52,T=12,B=22;
  let vs=points.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(band){lo=Math.min(lo,band[0]);hi=Math.max(hi,band[1])}
  if(zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const x=i=>L+i/(points.length-1)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,class:"chart",role:"img","aria-label":label});
  const step=niceStep((hi-lo)/4);
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){el("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"grid"},s);const t=el("text",{x:W-R+6,y:y(v)+4},s);t.textContent=fmt(v,step<1?1:0)}
  const d=points.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.v)).join(" ");
  el("path",{d:d+` L${x(points.length-1)} ${H-B} L${x(0)} ${H-B} Z`,fill:css(color),opacity:.10,class:"fadein"},s);
  el("path",{d,fill:"none",stroke:css(color),"stroke-width":2,"stroke-linejoin":"round",class:"draw"},s);
  points.forEach((p,i)=>{const last=i===points.length-1;el("circle",{cx:x(i),cy:y(p.v),r:last?4:2.5,fill:last?css(color):css("--surface"),stroke:css(color),"stroke-width":1.5,class:"pt"+(last?" lastpt":"")},s);el("circle",{cx:x(i),cy:y(p.v),r:12,fill:"transparent",class:"hit","data-tip":p.l+"　"+fmt(p.v,dec)},s);
    if(i===0||last||points.length<=6){const t=el("text",{x:x(i),y:H-6,"text-anchor":i===0?"start":last?"end":"middle"},s);t.textContent=p.l}});
  const lp=points[points.length-1];const t=el("text",{x:x(points.length-1)-6,y:y(lp.v)-8,"text-anchor":"end","font-weight":600},s);t.style.fill=css("--fg");t.textContent=fmt(lp.v,dec);
  return s;
}

function barChart(points,{label}={}){
  if(points.length<1)return null;
  const W=320,H=150,L=8,R=52,T=12,B=22;
  const max=Math.max(...points.map(p=>Math.abs(p.v)),100)*1.15;
  const y=v=>T+(max-v)/(2*max)*(H-T-B);
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,class:"chart",role:"img","aria-label":label});
  [max*0.75,0,-max*0.75].forEach(v=>{el("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"grid"},s);const t=el("text",{x:W-R+6,y:y(v)+4},s);t.textContent=fmt(Math.round(v/50)*50)});
  const bw=Math.min(28,(W-L-R)/points.length*.6);
  points.forEach((p,i)=>{const cx=L+(i+.5)*(W-L-R)/points.length;
    el("rect",{x:cx-bw/2,width:bw,y:Math.min(y(p.v),y(0)),height:Math.max(Math.abs(y(p.v)-y(0)),1.5),rx:2,fill:css(p.v>=0?"--up-x":"--down-x"),class:(p.v>=0?"gy-b":"gy-t")+" hit","data-tip":p.l+"　"+sgn(p.v,0)+" 百萬美元"},s);
    const t=el("text",{x:cx,y:H-6,"text-anchor":"middle"},s);t.textContent=p.l;
    const vt=el("text",{x:cx,y:p.v>=0?y(p.v)-4:y(p.v)+12,"text-anchor":"middle","font-weight":600},s);vt.style.fill=css("--fg");vt.textContent=sgn(p.v,0)});
  return s;
}

function hbar(stocks){
  if(!stocks?.length)return null;
  const rows=stocks.filter(x=>isNum(x.chg));if(!rows.length)return null;
  const max=Math.max(...rows.map(r=>Math.abs(r.chg)),1);
  const hasPos=rows.some(r=>r.chg>0),hasNeg=rows.some(r=>r.chg<0);
  const zero=hasPos&&hasNeg?50:hasNeg?100:0, span=hasPos&&hasNeg?50:100;
  const box=document.createElement("div");box.className="hb";box.setAttribute("role","list");box.setAttribute("aria-label","追蹤標的漲跌");
  box.innerHTML=rows.map(r=>{const w=Math.max(Math.abs(r.chg)/max*span,1);const left=r.chg>=0?zero:zero-w;
    return '<div class="hb-row" role="listitem"><span class="hb-sym num">'+esc(r.sym)+'</span><span class="hb-track"><i class="hb-zero" style="left:'+zero+'%"></i><i class="hb-bar '+(r.chg>=0?"up":"down")+'" style="left:'+left+'%;width:'+w+'%"></i></span><span class="hb-val num chg '+dir(r.chg)+'">'+sgn(r.chg,2)+'%</span>'+(r.note?'<span class="hb-note">'+esc(r.note)+'</span>':'')+'</div>'}).join("");
  return box;
}

/* ---------- reading guides ---------- */
const GUIDE={
 kpis:["恐懼貪婪指數 0–100：25 以下是極度恐懼，常出現在恐慌拋售之後；75 以上是極度貪婪，代表追高情緒重。它反映情緒，不是買賣訊號。","ETF 淨流量：正值代表新資金透過 ETF 買進現貨，負值代表贖回。數據以美股交易日計，週末沒有新數字。","資金費率：永續合約多空之間的定期費用。正值是多方付給空方，代表做多的人比較多；高於約 0.03%／8 小時就算擁擠，容易出現多單被連環清算。","多空帳戶比：是「帳戶數」比例，不是部位金額。帳戶大多做多、價格卻往下時，代表散戶站錯邊，下跌時清算會放大跌幅。"],
 kline:["每一根 K 線代表 4 小時：實心綠色是這 4 小時收漲、紅色是收跌；上下細線（影線）是期間最高和最低價。","橘線 EMA20 看短期趨勢，紫線 EMA50 看中期趨勢。價格在兩條線下方、而且 EMA20 在 EMA50 下方，叫「空頭排列」，反彈常在均線附近遇到賣壓；反過來就是多頭排列。","淡藍色帶是布林通道（20 根均價上下 2 個標準差）。通道收窄代表波動變小、常在醞釀方向；碰到上下軌不等於一定反轉。","下方柱子是成交量。長 K 線搭配爆量，代表有真實資金推動（例如消息面）；縮量的上漲或下跌比較容易被收回。","虛線是報告列的支撐（綠）和壓力（紅），彩色底帶是報告標出的走勢階段，可以對照下方「為什麼是這個走勢」。"],
 causal:["這條鏈從左到右讀：先看「現在發生什麼」，再看背後的共同原因，接著是透過哪些管道傳到別的市場、誰先反應誰後反應，最後是用什麼數據驗證這個判斷。","同一個原因常同時影響美股和加密貨幣，所以兩邊一起跌不一定是互相拖累，可能是共同受到利率或風險情緒影響。"],
 ladder:["中間藍線是報告產出時的價格，綠色帶是支撐、紅色帶是壓力。","每個情境的柱子：圓點是進場價，灰色段是到停損的距離（可能虧的），彩色段是到目標的距離（可能賺的）。彩色段比灰色段長越多，風報比越好。","情境要等「觸發條件」成立才算數，價格在兩個情境中間時就是不交易區。"],
 trends:["每個點是一份報告當下的快照，不是連續行情；看的是報告與報告之間的變化方向。","ETF 柱以美股交易日排列，綠柱是淨流入、紅柱是淨流出。連續幾天流出通常代表機構在減碼。","恐懼貪婪從低檔回升，代表情緒在修復；在恐懼區還持續下降，代表賣壓還沒結束。"],
 macro:["10 年美債殖利率上升，代表資金成本變高，成長股和 BTC 這類高估值資產通常承壓。","美元指數走強，全球美元流動性變緊，對風險資產不利。","油價推動通膨預期，會影響 Fed 會不會升息；升息機率越高，風險資產越容易被壓。","VIX 是美股的恐慌指標，20 以上代表市場在避險。"],
 stocks:["長條是前一個交易日的漲跌幅。QQQ 是整體風險開關：QQQ 跌、半導體跌得更多，通常代表市場在殺高估值科技股，BTC 也常同步承壓。"],
 checks:["上一份報告留下的觀察點，今天實際的結果。連續不成立的判斷要特別注意，代表原本的看法可能有偏差。"]
};
function guideBtn(p,key){if(!GUIDE[key])return;const h=p.querySelector("h2");const b=document.createElement("button");b.type="button";b.className="gbtn";b.textContent="怎麼看";b.setAttribute("aria-expanded","false");

function curveChart(c){

  if(state.static&&cur&&!cur.full){$("#desk").innerHTML='<div class="panel empty"><h2>載入報告中…</h2></div>';
    fetch("data/reports/"+encodeURIComponent(cur.id)+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{Object.assign(cur,d,{full:true});if(state.current===cur.id)renderAll()}).catch(()=>{$("#desk").innerHTML='<div class="panel empty"><h2>讀取失敗</h2><p>找不到這份報告的資料檔。</p></div>'});return}
  renderDesk();afterRender()}
const RM=matchMedia("(prefers-reduced-motion: reduce)");
let lastAnimated=null;
function afterRender(force){
  const desk=$("#desk");
  [...desk.children].forEach((c,i)=>c.style.setProperty("--i",i));
  desk.querySelectorAll(".ladder .scn").forEach((g,i)=>g.style.setProperty("--d",(i*0.18)+"s"));
  desk.querySelectorAll(".draw").forEach(pth=>{try{pth.style.setProperty("--len",Math.ceil(pth.getTotalLength())+1)}catch(e){}});
  const fresh=state.current&&(state.current!==lastAnimated||force);
  if(fresh&&!RM.matches){desk.classList.remove("anim");void desk.offsetWidth;desk.classList.add("anim");countUp(desk)}
  else desk.classList.remove("anim");
  if(state.current)lastAnimated=state.current;
  wireLadder(desk);wirePhases(desk);
}
function countUp(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(".kpi .v, .macro .v, .hb-val")?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const m=n.nodeValue.match(/^([^\d]*?)([\d,]+(?:\.\d+)?)(.*)$/s);if(!m)return;
    const target=parseFloat(m[2].replace(/,/g,""));if(!isFinite(target))return;
    const dec=(m[2].split(".")[1]||"").length,comma=m[2].includes(","),t0=performance.now(),dur=900;
    const show=v=>{const s=comma||target>=1000?v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}):v.toFixed(dec);n.nodeValue=m[1]+s+m[3]};
    const tick=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);show(target*e);if(k<1)requestAnimationFrame(tick);else n.nodeValue=m[0]};
    show(0);requestAnimationFrame(tick)});
}
function wireLadder(root){
  const svg=root.querySelector(".ladder");if(!svg)return;
  const rows=root.querySelectorAll(".sc-table tr[data-i]");
  const focus=i=>{svg.classList.toggle("focus",i!=null);svg.querySelectorAll(".scn").forEach(g=>g.classList.toggle("on",g.dataset.i==i));rows.forEach(r=>r.classList.toggle("on",r.dataset.i==i))};
  rows.forEach(r=>{r.addEventListener("mouseenter",()=>focus(r.dataset.i));r.addEventListener("mouseleave",()=>focus(null));r.addEventListener("click",()=>focus(svg.classList.contains("focus")&&r.classList.contains("on")?null:r.dataset.i))});
  svg.querySelectorAll(".scn").forEach(g=>{g.addEventListener("mouseenter",()=>focus(g.dataset.i));g.addEventListener("mouseleave",()=>focus(null))});
}
/* tooltip */
const tip=document.createElement("div");tip.className="tip";tip.setAttribute("role","status");document.body.appendChild(tip);
function showTip(e,t){tip.textContent=t;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.classList.add("on")}
document.addEventListener("pointerover",e=>{const h=e.target.closest?.("[data-tip]");if(h){showTip(e,h.dataset.tip);const pt=h.previousElementSibling;if(pt?.classList.contains("pt"))pt.setAttribute("r",6)}});
document.addEventListener("pointermove",e=>{if(tip.classList.contains("on")&&e.target.closest?.("[data-tip]")){tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"}});
document.addEventListener("pointerout",e=>{const h=e.target.closest?.("[data-tip]");if(h){tip.classList.remove("on");const pt=h.previousElementSibling;if(pt?.classList.contains("pt"))pt.setAttribute("r",pt.classList.contains("lastpt")?4:2.5)}});
/* next report countdown */
function nextReport(){
  const now=new Date(),tp=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  const slots=[[7,55,"早報"],[20,52,"晚報＋美股"]];
  for(let d=0;d<2;d++)for(const [h,mi,n] of slots){const t=new Date(tp);t.setDate(tp.getDate()+d);t.setHours(h,mi,0,0);if(t>tp)return {n,h,mi,diff:t-tp}}
}
function updateNext(){const r=nextReport();if(!r)return;const m=Math.round(r.diff/60000),hh=Math.floor(m/60),mm=m%60;
  $("#next").innerHTML='下一份 <b>'+r.n+'</b> '+String(r.h).padStart(2,"0")+":"+String(r.mi).padStart(2,"0")+" · "+(hh?hh+" 小時 ":"")+mm+" 分後"}
updateNext();setInterval(updateNext,30000);
/* new report toast */
const toast=document.createElement("div");toast.className="toast";toast.setAttribute("role","status");toast.innerHTML='<span id="toast-t"></span><button type="button" id="toast-b">查看</button>';document.body.appendChild(toast);
let toastTimer;function notify(r){$("#toast-t").textContent="新的"+(KIND[r.kind]||"報告")+"送達："+r.date;toast.classList.add("on");$("#toast-b").onclick=()=>{toast.classList.remove("on");location.hash="r-"+r.id};clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("on"),9000)}

function setPressed(sel,attr,val){document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x.dataset[attr]===val?"true":"false"))}
document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{state.filter=b.dataset.k;setPressed("[data-k]","k",state.filter);try{localStorage.setItem("filter",state.filter)}catch(e){}if(location.hash)history.replaceState(null,"",location.pathname+location.search);renderAll()}));
try{const f=localStorage.getItem("filter");if(f==="all"||KIND[f]){state.filter=f;setPressed("[data-k]","k",f)}}catch(e){}
window.addEventListener("hashchange",()=>{renderAll();window.scrollTo({top:0})});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{renderDesk();afterRender()});
new MutationObserver(()=>{renderDesk();afterRender()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

(async()=>{
  const db=window.claude?await window.claude.use("db"):null;
  if(!db){
    try{const r=await fetch("data/index.json",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);const idx=await r.json();
      state.static=true;state.reports=(idx.reports||[]).slice().sort((a,b)=>a.sortKey<b.sortKey?1:-1);state.loaded=true;
      const getLive=()=>fetch("data/live.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(d=>{if(d){state.live=d;renderDesk();afterRender()}}).catch(()=>{});
      renderAll();getLive();setInterval(getLive,10*60*1000)}
    catch(e){state.loaded=true;$("#desk").innerHTML='<div class="panel empty"><h2>無法讀取日報</h2><p>在 claude.ai 開啟需要登入；在其他網址開啟時找不到 data/index.json。</p></div>'}
    return}
  const timer=setTimeout(()=>{if(!state.loaded)$("#desk").innerHTML='<div class="panel empty"><h2>暫時連不上資料</h2><p>網路恢復後會自動顯示。</p></div>'},10000);
  db.doc("live/market").onSnapshot(s=>{if(s.exists){state.live=s.data();if(state.loaded){renderDesk();afterRender()}}},()=>{});
  db.collection("reports").orderBy("sortKey","desc").limit(200).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);state.loaded=true}
    const before=new Set(state.reports.map(r=>r.id)),hadData=state.reports.length>0&&!snap.metadata.fromCache;
    state.reports=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(hadData){const nw=state.reports.find(r=>!before.has(r.id));if(nw)notify(nw)}
    renderAll();
  },err=>{clearTimeout(timer);state.loaded=true;$("#desk").innerHTML='<div class="panel empty"><h2>讀取失敗</h2><p>錯誤代碼：'+esc(err.code)+'</p></div>'});
})();
</script>
